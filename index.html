<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E8E3D0">
  <title>Menú</title>
  <!--
    Este archivo y 404.html deben ser idénticos: 404.html es el que atiende
    las direcciones limpias (/atono) en GitHub Pages.
  -->
  <script>
    // Fija la carpeta del sitio para que estilos y scripts carguen igual desde
    // /atono que desde la portada: '/repo/' en GitHub Pages, '/' con dominio propio.
    (function () {
      var onGitHub = location.hostname.slice(-10) === '.github.io';
      var base = document.createElement('base');
      base.href = onGitHub ? '/' + location.pathname.split('/')[1] + '/' : '/';
      document.head.appendChild(base);
    })();
  </script>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"><p class="status">Cargando menú…</p></div>
  <div id="toasts" aria-live="polite"></div>
  <script>
    // Si el menú no arranca (navegador antiguo, bloqueo de red, error), se
    // muestra el motivo en lugar de dejar "Cargando menú…" para siempre.
    (function () {
      var firstError = '';
      window.addEventListener('error', function (e) {
        if (firstError) return;
        var target = e.target || {};
        firstError = e.message || (target.src || target.href ? 'no se pudo descargar ' + (target.src || target.href) : 'error desconocido');
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (!firstError) firstError = String((e.reason && e.reason.message) || e.reason);
      });
      setTimeout(function () {
        var app = document.getElementById('app');
        var waiting = app && app.children.length === 1 && app.firstElementChild.className === 'status' && !app.querySelector('h1');
        if (!waiting) return;
        app.firstElementChild.innerHTML = '<strong>No se pudo cargar el menú.</strong><br>Recarga la página o prueba con otro navegador.<br><small></small>';
        app.querySelector('small').textContent = 'Detalle: ' + (firstError || 'la página no respondió') + ' · ' + navigator.userAgent;
      }, 20000);
    })();
  </script>
  <noscript><p class="status">Esta página necesita JavaScript para mostrar el menú.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
